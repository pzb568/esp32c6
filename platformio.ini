; PlatformIO Project Configuration for ESP32-C6 Smart Home Terminal
; Board: Waveshare ESP32-C6-DEV-KIT-N16 (16MB Flash, ESP32-C6-MINI-1)

[platformio]
default_envs = esp32-c6-dev

[env:esp32-c6-dev]
platform = espressif32
board = esp32-c6-devkitm-1
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Full 16MB flash layout with LittleFS partition
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.f_cpu = 160000000L
board_build.partitions = default_16MB.csv

; Enable C++17 for std::optional and structured bindings
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Wno-unused-parameter
    -Os
    -DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO

; LittleFS filesystem upload tool settings
board_build.filesystem = littlefs
board_build.ldscript = esp32c6_out.ld

; --- Arduino + Dependencies ---
lib_deps =
    ; ESPAsyncWebServer with WebSocket support
    esphome/ESPAsyncWebServer-esphome @ ^3.3.2
    ; AsyncTCP for ESP32-C6
    esphome/AsyncTCP-esphome @ ^2.1.5
    ; IRremote for infrared NEC encoding/decoding
    ArminJo/IRremote @ ^4.4.0
    ; ArduinoJson for serialization
    bblanchon/ArduinoJson @ ^7.3.1
    ; DNSServer (built-in, needed for captive portal)
    ; WiFi (built-in)
    ; LittleFS (built-in)

; Extra script to combine LittleFS image with firmware
extra_scripts =
    pre:build_script.py