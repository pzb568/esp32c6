name: 🏠 ESP32-C6 智能家庭终端 自动编译

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

  pull_request:
    branches: [ main ]

  workflow_dispatch:
    inputs:
      idf_version:
        description: 'ESP-IDF Docker 标签'
        required: false
        default: 'release-v5.3'
        type: choice
        options:
          - release-v5.3

# ═══════════════════════════════════════════════════════
# 并发控制
# ═══════════════════════════════════════════════════════
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# ═══════════════════════════════════════════════════════
# 全局环境变量
# ═══════════════════════════════════════════════════════
env:
  IDF_VERSION: "release-v5.3"
  TARGET: esp32c6
  PROJECT_NAME: smart_home_terminal

jobs:

  # ═════════════════════════════════════════════════════
  # Job 1 - 代码检查
  # ═════════════════════════════════════════════════════
  lint:
    name: 🔍 代码检查
    runs-on: ubuntu-22.04

    steps:

      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 检查必要文件
        run: |
          echo "════════ 项目结构检查 ════════"

          required_files=(
            "CMakeLists.txt"
            "main/CMakeLists.txt"
            "sdkconfig.defaults"
            "partitions.csv"
          )

          missing=0

          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "❌ 缺失: $f"
              missing=$((missing+1))
            else
              echo "✅ 存在: $f"
            fi
          done

          if [ $missing -ne 0 ]; then
            exit 1
          fi

      - name: 安装 cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: C/C++ 静态检查
        run: |
          cppcheck \
            --enable=warning,style,performance \
            --inline-suppr \
            --suppress=missingInclude \
            --suppress=missingIncludeSystem \
            --error-exitcode=1 \
            -I main \
            -I components \
            main components \
            2>&1 | tee cppcheck_report.txt

      - name: 上传检查报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-report
          path: cppcheck_report.txt
          retention-days: 7

  # ═════════════════════════════════════════════════════
  # Job 2 - 主构建
  # ═════════════════════════════════════════════════════
  build:
    name: 🔨 编译固件 (${{ github.event.inputs.idf_version || 'release-v5.3' }})
    runs-on: ubuntu-22.04

    needs: lint

    container:
      image: espressif/idf:${{ github.event.inputs.idf_version || 'release-v5.3' }}
      options: --user root

    steps:

      # ────────────────────────────────────────────────
      # 检出代码
      # ────────────────────────────────────────────────
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ────────────────────────────────────────────────
      # 修复 Git dubious ownership
      # ────────────────────────────────────────────────
      - name: 修复 Git safe.directory
        run: |
          git config --global --add safe.directory '*'

      # ────────────────────────────────────────────────
      # 缓存
      # ────────────────────────────────────────────────
      - name: 缓存 IDF 工具链
        uses: actions/cache@v4
        with:
          path: |
            ~/.espressif
            /root/.espressif
          key: idf-tools-${{ env.IDF_VERSION }}-${{ runner.os }}
          restore-keys: |
            idf-tools-${{ env.IDF_VERSION }}-

      - name: 缓存 build 目录
        uses: actions/cache@v4
        with:
          path: build
          key: build-${{ env.TARGET }}-${{ hashFiles('**/*.c', '**/*.h', '**/*.cpp', '**/*.hpp', 'sdkconfig.defaults') }}
          restore-keys: |
            build-${{ env.TARGET }}-

      # ────────────────────────────────────────────────
      # 构建环境
      # ────────────────────────────────────────────────
      - name: 打印构建环境
        run: |
          echo "�═�═�═�═�═�═�═�═�═�═�═�═�═�═�═�═�═�═�═�═�═�═�═�═�═�═�═�═�═�═"
          echo "ESP-IDF:  $IDF_VERSION"
          echo "TARGET:   $TARGET"
          echo "Runner:   ${{ runner.os }}"
          echo "Branch:   ${{ github.ref_name }}"
          echo "Commit:   ${{ github.sha }}"
          echo "�═�═�═�═�═�═�═�═�═�═�═�═�═�═�═�═�═�═�═�═�═�═�═�═�═�═�═�═�═"
          
          . $IDF_PATH/export.sh
          
          idf.py --version
          python --version
          git --version
          
      - name: � 添加 ESP-TLS 依�赖
        run: |
          . $IDF_PATH/export.sh
          idf.py add-dependency esp_tls
          
          # �� 调试：�检查esp_tls组件是否存在
          echo "�检查ESP-IDF组件目录..."
          ls -la $IDF_PATH/components/ | grep esp_tls || echo "未�找到esp_tls组件"
          if [ -d "$IDF_PATH/components/esp_tls" ]; then
            echo "��✅ esp_tls组件存在于: $IDF_PATH/components/esp_tls"
          else
            echo "��❌ esp_tls组件未�找到！"
            # 列出所有以esp_t开头的组件
            ls $IDF_PATH/components/ | grep ^esp_t || echo "没有�找到esp_t*组件"
          fi

      # ────────────────────────────────────────────────
      # 设置芯片目标
      # ────────────────────────────────────────────────
      - name: 配置目标芯片
        run: |
          . $IDF_PATH/export.sh

          rm -f sdkconfig
          rm -rf build

          idf.py set-target $TARGET

          echo "✅ 已设置目标芯片: $TARGET"

      # ────────────────────────────────────────────────
      # 版本信息
      # ────────────────────────────────────────────────
      - name: 生成版本头文件
        run: |
          BUILD_TIME=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          GIT_HASH=$(git rev-parse --short HEAD)
          GIT_TAG=$(git describe --tags --always 2>/dev/null || echo "v0.0.0")

          cat > main/version.h << EOF
          #pragma once

          #define FW_VERSION       "${GIT_TAG}"
          #define FW_GIT_HASH      "${GIT_HASH}"
          #define FW_BUILD_TIME    "${BUILD_TIME}"
          #define FW_IDF_VERSION   "${IDF_VERSION}"
          #define FW_TARGET        "${TARGET}"

          EOF

          echo "════════ version.h ════════"
          cat main/version.h

      # ────────────────────────────────────────────────
      # 编译
      # ────────────────────────────────────────────────
      - name: 编译固件
        run: |
          . $IDF_PATH/export.sh

          idf.py fullclean || true

          NPROC=$(nproc)

          echo "使用 $NPROC 核心编译"

          idf.py build -j $NPROC 2>&1 | tee build.log

      # ────────────────────────────────────────────────
      # 固件大小
      # ────────────────────────────────────────────────
      - name: 检查固件大小
        run: |
          . $IDF_PATH/export.sh

          idf.py size

          APP_BIN=$(find build -maxdepth 1 -name "*.bin" \
            ! -name "bootloader.bin" \
            ! -name "partition-table.bin" \
            | head -1)

          if [ -z "$APP_BIN" ] || [ ! -f "$APP_BIN" ]; then
            echo "❌ 未找到主固件，尝试使用IDF自带的方法获取..."
            # 使用idf.py获取固件路径
            APP_BIN="build/${{ env.PROJECT_NAME }}.bin"
            if [ ! -f "$APP_BIN" ]; then
              echo "❌ 主固件不存在: $APP_BIN"
              ls -la build/*.bin 2>&1 || true
              exit 1
            fi
          fi

          FW_SIZE=$(stat -c%s "$APP_BIN")

          echo "固件路径: $APP_BIN"
          echo "固件大小: $((FW_SIZE / 1024)) KB"

      # ────────────────────────────────────────────────
      # 打包
      # ────────────────────────────────────────────────
      - name: 打包固件
        run: |
          # 确保zip已安装
          apt-get update && apt-get install -y zip tar

          GIT_HASH=$(git rev-parse --short HEAD)
          GIT_TAG=$(git describe --tags --always 2>/dev/null || echo "v0.0.0")
          TIMESTAMP=$(date -u '+%Y%m%d_%H%M%S')
          PROJECT_NAME=smart_home_terminal

          PACKAGE_NAME="${PROJECT_NAME}_${GIT_TAG}_${GIT_HASH}_${TIMESTAMP}"

          mkdir -p firmware_package

          # 使用idf.py获取准确的固件路径
          . $IDF_PATH/export.sh
          APP_BIN=$(idf.py -q get-build-properties | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('app_bin', ''))")

          # 如果idf方法失败，则使用备用方法
          if [ -z "$APP_BIN" ] || [ ! -f "$APP_BIN" ]; then
            echo "⚠️  使用备用方法查找固件..."
            APP_BIN=$(find build -maxdepth 1 -name "*.bin" \
              ! -name "bootloader.bin" \
              ! -name "partition-table.bin" \
              | head -1)
          fi

          # 最后尝试已知的文件名
          if [ -z "$APP_BIN" ] || [ ! -f "$APP_BIN" ]; then
            APP_BIN="build/${PROJECT_NAME}.bin"
          fi

          echo "📦 使用固件文件: $APP_BIN"

          if [ ! -f "$APP_BIN" ]; then
            echo "❌ 无法找到主固件文件！"
            echo "build目录内容:"
            ls -la build/*.bin 2>&1 || true
            exit 1
          fi

          cp "$APP_BIN" firmware_package/${PROJECT_NAME}.bin

          # 复制启动加载器和分区表
          cp build/bootloader/bootloader.bin firmware_package/
          cp build/partition-table.bin firmware_package/

          if [ -f build/storage.bin ]; then
            cp build/storage.bin firmware_package/
          fi

          sha256sum firmware_package/*.bin \
            > firmware_package/SHA256SUMS.txt

          cat > firmware_package/FLASH_README.txt << EOF
          ESP32-C6 固件烧录说明

          esptool.py \
            --chip esp32c6 \
            --port /dev/ttyUSB0 \
            --baud 460800 \
            write_flash \
            0x0 bootloader.bin \
            0x8000 partition-table.bin \
            0x10000 ${PROJECT_NAME}.bin
          EOF

          tar -czf ${PACKAGE_NAME}.tar.gz firmware_package
          zip -r ${PACKAGE_NAME}.zip firmware_package

          echo "PACKAGE_NAME=${PACKAGE_NAME}" >> $GITHUB_ENV

          ls -lh *.tar.gz *.zip

      # ────────────────────────────────────────────────
      # 上传固件
      # ────────────────────────────────────────────────
      - name: 上传固件 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ env.PACKAGE_NAME }}
          path: |
            firmware_package/
            *.tar.gz
            *.zip
            build.log
          retention-days: 30

      # ────────────────────────────────────────────────
      # 编译失败日志
      # ────────────────────────────────────────────────
      - name: 上传失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-build-log
          path: |
            build.log
            sdkconfig
          retention-days: 14

      # ────────────────────────────────────────────────
      # 构建摘要
      # ────────────────────────────────────────────────
      - name: 生成构建摘要
        if: always()
        run: |
          GIT_HASH=$(git rev-parse --short HEAD)
          GIT_TAG=$(git describe --tags --always 2>/dev/null || echo "v0.0.0")

          APP_BIN=$(find build -maxdepth 1 -name "*.bin" \
            ! -name "bootloader.bin" \
            ! -name "partition-table.bin" \
            | head -1)

          if [ -z "$APP_BIN" ] || [ ! -f "$APP_BIN" ]; then
            APP_BIN="build/${{ env.PROJECT_NAME }}.bin"
          fi

          FW_SIZE=$(stat -c%s "$APP_BIN" 2>/dev/null || echo 0)

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🏠 ESP32-C6 智能家庭终端

          | 项目 | 值 |
          |------|------|
          | 固件版本 | ${GIT_TAG} |
          | Git Commit | \`${GIT_HASH}\` |
          | IDF 版本 | ${IDF_VERSION} |
          | 芯片 | ESP32-C6 |
          | 固件大小 | $((FW_SIZE / 1024)) KB |
          | 构建时间 | $(date -u '+%Y-%m-%d %H:%M UTC') |

          ### 硬件
          - ESP32-C6-DEV-KIT
          - INMP441 I2S 麦克风
          - MAX98357 I2S 功放
          - NEC 红外收发
          - MQTT
          - DeepSeek AI
          EOF

  # ═════════════════════════════════════════════════════
  # Job 3 - 多版本兼容性测试
  # ═════════════════════════════════════════════════════
  compat-test:
    name: 🧪 兼容性测试
    runs-on: ubuntu-22.04

    needs: lint

    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    container:
      image: espressif/idf:release-v5.3
      options: --user root

    steps:

      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 修复 Git safe.directory
        run: |
          git config --global --add safe.directory '*'

      - name: 编译测试
        run: |
          . $IDF_PATH/export.sh

          rm -f sdkconfig
          rm -rf build

          idf.py set-target esp32c6

          idf.py build

          echo "✅ ESP-IDF v5.3 编译通过"

  # ═════════════════════════════════════════════════════
  # Job 4 - Release
  # ═════════════════════════════════════════════════════
  release:
    name: 🚀 发布 Release
    runs-on: ubuntu-22.04

    needs:
      - build

    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:

      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载 Artifact
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true
          path: release_assets

      - name: 检查下载内容
        run: |
          echo "📦 下载的release assets:"
          ls -la release_assets/
          echo ""
          echo "📂 firmware_package 内容:"
          ls -la release_assets/firmware_package/ 2>/dev/null || echo "firmware_package目录不存在"

      - name: 生成 Release Notes
        run: |
          TAG=${GITHUB_REF#refs/tags/}

          # 查找SHA256校验和文件
          SHA256_FILE=""
          if [ -f "release_assets/firmware_package/SHA256SUMS.txt" ]; then
            SHA256_FILE="release_assets/firmware_package/SHA256SUMS.txt"
          elif [ -f "release_assets/SHA256SUMS.txt" ]; then
            SHA256_FILE="release_assets/SHA256SUMS.txt"
          fi

          cat > release_notes.md << EOF
          # 🏠 ESP32-C6 智能家庭终端 ${TAG}

          ## 功能
          - INMP441 I2S 麦克风
          - MAX98357 音频播放
          - DeepSeek AI
          - MQTT 智能家居
          - Web 配置界面
          - 红外遥控

          ## 硬件接线
          | 模块 | ESP32-C6 引脚 |
          |------|--------------|
          | INMP441 SCK | GPIO16 |
          | INMP441 WS | GPIO17 |
          | INMP441 DATA | GPIO18 |
          | MAX98357 BCLK | GPIO6 |
          | MAX98357 LRC | GPIO7 |
          | MAX98357 DIN | GPIO15 |
          | 红外发射 | GPIO2 |
          | 红外接收 | GPIO3 |

          ## 校验和
          \`\`\`
          $(cat "$SHA256_FILE" 2>/dev/null || echo "校验和未生成")
          \`\`\`

          ## 烧录说明
          使用 esptool.py 烧录固件：

          \`\`\`bash
          esptool.py \
            --chip esp32c6 \
            --port /dev/ttyUSB0 \
            --baud 460800 \
            write_flash \
            0x0 bootloader.bin \
            0x8000 partition-table.bin \
            0x10000 smart_home_terminal.bin
          \`\`\`
          EOF

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ESP32-C6-${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            release_assets/*.tar.gz
            release_assets/*.zip
            release_assets/firmware_package/*.bin
            release_assets/firmware_package/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
