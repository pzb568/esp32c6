name: 🏠 ESP32-C6 智能家庭终端 自动编译

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

  pull_request:
    branches: [ main ]

  workflow_dispatch:
    inputs:
      idf_version:
        description: 'ESP-IDF Docker 标签'
        required: false
        default: 'release-v5.3'

# ═══════════════════════════════════════════════════════
# 并发控制
# ═══════════════════════════════════════════════════════
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# ═══════════════════════════════════════════════════════
# 全局环境变量
# ═══════════════════════════════════════════════════════
env:
  IDF_VERSION: ${{ github.event.inputs.idf_version || 'release-v5.3' }}
  TARGET: esp32c6
  PROJECT_NAME: smart_home_terminal

jobs:

  # ═════════════════════════════════════════════════════
  # Job 1 - 代码检查
  # ═════════════════════════════════════════════════════
  lint:
    name: 🔍 代码检查
    runs-on: ubuntu-22.04

    steps:

      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 检查必要文件
        run: |
          echo "════════ 项目结构检查 ════════"

          required_files=(
            "CMakeLists.txt"
            "main/CMakeLists.txt"
            "sdkconfig.defaults"
            "partitions.csv"
          )

          missing=0

          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "❌ 缺失: $f"
              missing=$((missing+1))
            else
              echo "✅ 存在: $f"
            fi
          done

          if [ $missing -ne 0 ]; then
            exit 1
          fi

      - name: 安装 cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: C/C++ 静态检查
        run: |
          cppcheck \
            --enable=warning,style,performance \
            --inline-suppr \
            --suppress=missingInclude \
            --suppress=missingIncludeSystem \
            --error-exitcode=1 \
            -I main \
            -I components \
            main components \
            2>&1 | tee cppcheck_report.txt

      - name: 上传检查报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-report
          path: cppcheck_report.txt
          retention-days: 7

  # ═════════════════════════════════════════════════════
  # Job 2 - 主构建
  # ═════════════════════════════════════════════════════
  build:
    name: 🔨 编译固件 (${{ github.event.inputs.idf_version || 'release-v5.3' }})
    runs-on: ubuntu-22.04

    needs: lint

    container:
      image: espressif/idf:${{ github.event.inputs.idf_version || 'release-v5.3' }}
      options: --user root

    steps:

      # ────────────────────────────────────────────────
      # 检出代码
      # ────────────────────────────────────────────────
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ────────────────────────────────────────────────
      # 修复 Git dubious ownership
      # ────────────────────────────────────────────────
      - name: 修复 Git safe.directory
        run: |
          git config --global --add safe.directory '*'

      # ────────────────────────────────────────────────
      # 缓存
      # ────────────────────────────────────────────────
      - name: 缓存 IDF 工具链
        uses: actions/cache@v4
        with:
          path: |
            ~/.espressif
            /root/.espressif
          key: idf-tools-${{ env.IDF_VERSION }}-${{ runner.os }}
          restore-keys: |
            idf-tools-${{ env.IDF_VERSION }}-

      - name: 缓存 build 目录
        uses: actions/cache@v4
        with:
          path: build
          key: build-${{ env.TARGET }}-${{ hashFiles('**/*.c', '**/*.h', '**/*.cpp', '**/*.hpp', 'sdkconfig.defaults') }}
          restore-keys: |
            build-${{ env.TARGET }}-

      # ────────────────────────────────────────────────
      # 构建环境
      # ────────────────────────────────────────────────
      - name: 打印构建环境
        run: |
          echo "══════════════════════════════"
          echo "ESP-IDF:  $IDF_VERSION"
          echo "TARGET:   $TARGET"
          echo "Runner:   ${{ runner.os }}"
          echo "Branch:   ${{ github.ref_name }}"
          echo "Commit:   ${{ github.sha }}"
          echo "══════════════════════════════"

          . $IDF_PATH/export.sh

          idf.py --version
          python --version
          git --version

      # ────────────────────────────────────────────────
      # 设置芯片目标
      # ────────────────────────────────────────────────
      - name: 配置目标芯片
        run: |
          . $IDF_PATH/export.sh

          rm -f sdkconfig
          rm -rf build

          idf.py set-target $TARGET

          echo "✅ 已设置目标芯片: $TARGET"

      # ────────────────────────────────────────────────
      # 版本信息
      # ────────────────────────────────────────────────
      - name: 生成版本头文件
        run: |
          BUILD_TIME=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          GIT_HASH=$(git rev-parse --short HEAD)
          GIT_TAG=$(git describe --tags --always 2>/dev/null || echo "v0.0.0")

          cat > main/version.h << EOF
          #pragma once

          #define FW_VERSION       "${GIT_TAG}"
          #define FW_GIT_HASH      "${GIT_HASH}"
          #define FW_BUILD_TIME    "${BUILD_TIME}"
          #define FW_IDF_VERSION   "${IDF_VERSION}"
          #define FW_TARGET        "${TARGET}"

          EOF

          echo "════════ version.h ════════"
          cat main/version.h

      # ────────────────────────────────────────────────
      # 编译
      # ────────────────────────────────────────────────
      - name: 编译固件
        run: |
          . $IDF_PATH/export.sh

          idf.py fullclean || true

          NPROC=$(nproc)

          echo "使用 $NPROC 核心编译"

          idf.py build -j $NPROC 2>&1 | tee build.log

      # ────────────────────────────────────────────────
      # 固件大小
      # ────────────────────────────────────────────────
      - name: 检查固件大小
        run: |
          . $IDF_PATH/export.sh

          idf.py size

          APP_BIN=$(find build -maxdepth 1 -name "*.bin" \
            ! -name "bootloader.bin" \
            ! -name "partition-*.bin" \
            | head -1)

          if [ -z "$APP_BIN" ]; then
            echo "❌ 未找到主固件"
            exit 1
          fi

          FW_SIZE=$(stat -c%s "$APP_BIN")

          echo "固件大小: $((FW_SIZE / 1024)) KB"

      # ────────────────────────────────────────────────
      # 打包
      # ────────────────────────────────────────────────
      - name: 打包固件
        run: |
          GIT_HASH=$(git rev-parse --short HEAD)
          GIT_TAG=$(git describe --tags --always 2>/dev/null || echo "v0.0.0")
          TIMESTAMP=$(date -u '+%Y%m%d_%H%M%S')
          PROJECT_NAME=smart_home_terminal

          PACKAGE_NAME="${PROJECT_NAME}_${GIT_TAG}_${GIT_HASH}_${TIMESTAMP}"

          mkdir -p firmware_package

          APP_BIN=$(find build -maxdepth 1 -name "*.bin" \
            ! -name "bootloader.bin" \
            ! -name "partition-table.bin" \
            | head -1)

          # 如果找不到则尝试另一种命名格式
          if [ ! -f "$APP_BIN" ]; then
            APP_BIN="build/smart_home_terminal.bin"
          fi

          cp "$APP_BIN" firmware_package/${PROJECT_NAME}.bin

          # 复制分区表文件（注意：ESP-IDF生成的是 partition-table.bin 而非 partition-*.bin）
          cp build/bootloader/bootloader.bin firmware_package/
          cp build/partition-table.bin firmware_package/

          if [ -f build/storage.bin ]; then
            cp build/storage.bin firmware_package/
          fi

          sha256sum firmware_package/*.bin \
            > firmware_package/SHA256SUMS.txt

          cat > firmware_package/FLASH_README.txt << EOF
          ESP32-C6 固件烧录说明

          esptool.py \
            --chip esp32c6 \
            --port /dev/ttyUSB0 \
            --baud 460800 \
            write_flash \
            0x0 bootloader.bin \
            0x8000 partition-table.bin \
            0x10000 ${PROJECT_NAME}.bin
          EOF

          tar -czf ${PACKAGE_NAME}.tar.gz firmware_package
          zip -r ${PACKAGE_NAME}.zip firmware_package

          echo "PACKAGE_NAME=${PACKAGE_NAME}" >> $GITHUB_ENV

          ls -lh *.tar.gz *.zip

      # ────────────────────────────────────────────────
      # 上传固件
      # ────────────────────────────────────────────────
      - name: 上传固件 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ env.PACKAGE_NAME }}
          path: |
            firmware_package/
            *.tar.gz
            *.zip
            build.log
          retention-days: 30

      # ────────────────────────────────────────────────
      # 编译失败日志
      # ────────────────────────────────────────────────
      - name: 上传失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-build-log
          path: |
            build.log
            sdkconfig
          retention-days: 14

      # ────────────────────────────────────────────────
      # 构建摘要
      # ────────────────────────────────────────────────
      - name: 生成构建摘要
        if: always()
        run: |
          GIT_HASH=$(git rev-parse --short HEAD)
          GIT_TAG=$(git describe --tags --always 2>/dev/null || echo "v0.0.0")

          APP_BIN=$(find build -maxdepth 1 -name "*.bin" \
            ! -name "bootloader.bin" \
            ! -name "partition-*.bin" \
            | head -1)

          FW_SIZE=$(stat -c%s "$APP_BIN" 2>/dev/null || echo 0)

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🏠 ESP32-C6 智能家庭终端

          | 项目 | 值 |
          |------|------|
          | 固件版本 | ${GIT_TAG} |
          | Git Commit | \`${GIT_HASH}\` |
          | IDF 版本 | ${IDF_VERSION} |
          | 芯片 | ESP32-C6 |
          | 固件大小 | $((FW_SIZE / 1024)) KB |
          | 构建时间 | $(date -u '+%Y-%m-%d %H:%M UTC') |

          ### 硬件
          - ESP32-C6-DEV-KIT
          - INMP441 I2S 麦克风
          - MAX98357 I2S 功放
          - NEC 红外收发
          - MQTT
          - DeepSeek AI
          EOF

  # ═════════════════════════════════════════════════════
  # Job 3 - 多版本兼容性测试
  # ═════════════════════════════════════════════════════
  compat-test:
    name: 🧪 兼容性测试 (${{ matrix.idf_version }})
    runs-on: ubuntu-22.04

    needs: lint

    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    strategy:
      fail-fast: false
      matrix:
        idf_version:
          - release-v5.2
          - release-v5.3

    container:
      image: espressif/idf:${{ matrix.idf_version }}
      options: --user root

    steps:

      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 修复 Git safe.directory
        run: |
          git config --global --add safe.directory '*'

      - name: 编译测试
        run: |
          . $IDF_PATH/export.sh

          rm -f sdkconfig
          rm -rf build

          idf.py set-target esp32c6

          idf.py build

          echo "✅ ${{ matrix.idf_version }} 编译通过"

  # ═════════════════════════════════════════════════════
  # Job 4 - Release
  # ═════════════════════════════════════════════════════
  release:
    name: 🚀 发布 Release
    runs-on: ubuntu-22.04

    needs:
      - build
      - compat-test

    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:

      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载 Artifact
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true
          path: release_assets

      - name: 生成 Release Notes
        run: |
          TAG=${GITHUB_REF#refs/tags/}

          cat > release_notes.md << EOF
          # 🏠 ESP32-C6 智能家庭终端 ${TAG}

          ## 功能
          - INMP441 I2S 麦克风
          - MAX98357 音频播放
          - DeepSeek AI
          - MQTT 智能家居
          - Web 配置界面
          - 红外遥控

          ## 校验和
          \`\`\`
          $(cat release_assets/SHA256SUMS.txt 2>/dev/null || echo "校验和未生成")
          \`\`\`

          ## 烧录
          使用 esptool.py 烧录 firmware_package 中的文件。
          EOF

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ESP32-C6-${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            release_assets/*.tar.gz
            release_assets/*.zip
            release_assets/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
