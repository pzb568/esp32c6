name: 🏠 ESP32-C6 智能家庭终端 自动编译

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      idf_version:
        description: 'ESP-IDF Docker 标签'
        required: false
        default: 'release-v5.3'
        type: choice
        options:
          - release-v5.3

# ═══════════════════════════════════════════════════════
# 并发控制
# ═══════════════════════════════════════════════════════
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# ═══════════════════════════════════════════════════════
# 全局环境变量
# ═══════════════════════════════════════════════════════
env:
  IDF_VERSION: ${{ github.event.inputs.idf_version || 'release-v5.3' }}
  TARGET: esp32c6
  PROJECT_NAME: smart_home_terminal

  # 固件初始版本
  # 正式发布从 v0.1 开始
  BASE_VERSION: '0.1'

jobs:

  # ═════════════════════════════════════════════════════
  # Job 1 - 代码检查
  # ═════════════════════════════════════════════════════
  lint:
    name: 🔍 代码检查
    runs-on: ubuntu-22.04

    steps:

      # ────────────────────────────────────────────────
      # 检出代码
      # ────────────────────────────────────────────────
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # ────────────────────────────────────────────────
      # 检查必要文件
      # ────────────────────────────────────────────────
      - name: 检查必要文件
        shell: bash
        run: |
          set -euo pipefail

          echo "════════ 项目结构检查 ════════"

          required_files=(
            "CMakeLists.txt"
            "main/CMakeLists.txt"
            "main/main.c"
            "sdkconfig.defaults"
            "partitions.csv"
          )

          missing=0

          for f in "${required_files[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "❌ 缺失: $f"
              missing=$((missing + 1))
            else
              echo "✅ 存在: $f"
            fi
          done

          if (( missing > 0 )); then
            echo "❌ 项目结构检查失败"
            exit 1
          fi

      # ────────────────────────────────────────────────
      # 检查组件
      # ────────────────────────────────────────────────
      - name: 检查自定义组件
        shell: bash
        run: |
          set -euo pipefail

          echo "════════ 自定义组件检查 ════════"

          required_components=(
            "components/ir_control/CMakeLists.txt"
            "components/audio/CMakeLists.txt"
            "components/mqtt_client/CMakeLists.txt"
            "components/ai_engine/CMakeLists.txt"
            "components/web_server/CMakeLists.txt"
          )

          missing=0

          for f in "${required_components[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "❌ 缺失: $f"
              missing=$((missing + 1))
            else
              echo "✅ 存在: $f"
            fi
          done

          if (( missing > 0 )); then
            echo "❌ 自定义组件检查失败"
            exit 1
          fi

      # ────────────────────────────────────────────────
      # 检查组件名称
      # ────────────────────────────────────────────────
      - name: 检查组件依赖声明
        shell: bash
        run: |
          set -euo pipefail

          echo "════════ 组件依赖检查 ════════"

          if grep -q 'audio_pipeline' main/CMakeLists.txt; then
            echo "❌ main/CMakeLists.txt 仍然使用错误组件名: audio_pipeline"
            echo "   正确组件名应该是: audio"
            exit 1
          fi

          if grep -q 'mqtt_client_mgr' main/CMakeLists.txt; then
            echo "❌ main/CMakeLists.txt 仍然使用错误组件名: mqtt_client_mgr"
            echo "   正确组件名应该是: mqtt_client"
            exit 1
          fi

          required_components=(
            "ir_control"
            "audio"
            "mqtt_client"
            "ai_engine"
            "web_server"
          )

          for component in "${required_components[@]}"; do
            if grep -qE "^[[:space:]]*${component}[[:space:]]*$" main/CMakeLists.txt; then
              echo "✅ main → ${component}"
            else
              echo "⚠️ main/CMakeLists.txt 未直接声明: ${component}"
            fi
          done

      # ────────────────────────────────────────────────
      # 安装 cppcheck
      # ────────────────────────────────────────────────
      - name: 安装 cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      # ────────────────────────────────────────────────
      # C/C++ 静态检查
      # ────────────────────────────────────────────────
      - name: C/C++ 静态检查
        shell: bash
        run: |
          set -o pipefail

          cppcheck \
            --enable=warning,style,performance \
            --inline-suppr \
            --suppress=missingInclude \
            --suppress=missingIncludeSystem \
            --error-exitcode=1 \
            -I main \
            -I components \
            main components \
            2>&1 | tee cppcheck_report.txt

      # ────────────────────────────────────────────────
      # 上传检查报告
      # ────────────────────────────────────────────────
      - name: 上传检查报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-report
          path: cppcheck_report.txt
          if-no-files-found: ignore
          retention-days: 7

  # ═════════════════════════════════════════════════════
  # Job 2 - 主构建
  # ═════════════════════════════════════════════════════
  build:
    name: 🔨 编译固件 (${{ github.event.inputs.idf_version || 'release-v5.3' }})
    runs-on: ubuntu-22.04

    needs: lint

    container:
      image: espressif/idf:${{ github.event.inputs.idf_version || 'release-v5.3' }}
      options: --user root

    steps:

      # ────────────────────────────────────────────────
      # 检出代码
      # ────────────────────────────────────────────────
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ────────────────────────────────────────────────
      # Git safe.directory
      # ────────────────────────────────────────────────
      - name: 修复 Git safe.directory
        run: |
          git config --global --add safe.directory '*'

      # ────────────────────────────────────────────────
      # 缓存 ESP-IDF 工具链
      # ────────────────────────────────────────────────
      - name: 缓存 IDF 工具链
        uses: actions/cache@v4
        with:
          path: /root/.espressif
          key: idf-tools-${{ env.IDF_VERSION }}-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            idf-tools-${{ env.IDF_VERSION }}-${{ runner.os }}-

      # ────────────────────────────────────────────────
      # 打印构建环境
      # ────────────────────────────────────────────────
      - name: 打印构建环境
        shell: bash
        run: |
          set -euo pipefail

          echo "════════════════════════════════════════"
          echo "ESP-IDF:  $IDF_VERSION"
          echo "TARGET:   $TARGET"
          echo "Runner:   ${{ runner.os }}"
          echo "Arch:     ${{ runner.arch }}"
          echo "Branch:   ${{ github.ref_name }}"
          echo "Commit:   ${{ github.sha }}"
          echo "════════════════════════════════════════"

          . "$IDF_PATH/export.sh"

          idf.py --version
          python --version
          git --version
          cmake --version

      # ────────────────────────────────────────────────
      # 设置芯片目标
      # ──────────────────────────────────- name: 配置目标芯片
  shell: bash
  run: |
    set -euo pipefail

    . "$IDF_PATH/export.sh"

    echo "════════ Git 工作区检查 ════════"
    pwd

    echo "════════ Git HEAD ════════"
    git rev-parse HEAD
    git branch -av

    echo "════════ components ════════"
    ls -lah components/

    echo "════════ components/audio ════════"
    if [[ -d components/audio ]]; then
      echo "✅ components/audio 存在"
      ls -lah components/audio/
    else
      echo "❌ components/audio 不存在"
      exit 1
    fi

    echo "════════ Git tracked audio ════════"
    git ls-files components/audio

    echo "════════ 根 CMakeLists.txt ════════"
    sed -n '1,80p' CMakeLists.txt

    echo "════════ 清理旧构建 ════════"
    rm -f sdkconfig
    rm -rf build

    echo "════════ 设置目标芯片 ════════"
    idf.py set-target "$TARGET"

    echo "✅ 已设置目标芯片: $TARGET"
      # ────────────────────────────────────────────────
      # 确定固件版本
      # ────────────────────────────────────────────────
      - name: 确定固件版本
        shell: bash
        run: |
          set -euo pipefail

          # Tag 发布版本
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"

            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
              echo "❌ Tag 格式错误: ${GITHUB_REF_NAME}"
              echo "   正确格式示例: v0.1、v0.2、v1.0"
              exit 1
            fi
          else
            # 非 Tag 构建
            VERSION="${BASE_VERSION}-dev"
          fi

          echo "FW_VERSION=${VERSION}" >> "$GITHUB_ENV"

          echo "════════ 固件版本 ════════"
          echo "版本: ${VERSION}"

      # ────────────────────────────────────────────────
      # 生成版本头文件
      # ────────────────────────────────────────────────
      - name: 生成版本头文件
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TIME=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          GIT_HASH=$(git rev-parse --short HEAD)

          cat > main/version.h << EOF
          #pragma once

          #define FW_VERSION       "${FW_VERSION}"
          #define FW_GIT_HASH      "${GIT_HASH}"
          #define FW_BUILD_TIME    "${BUILD_TIME}"
          #define FW_IDF_VERSION   "${IDF_VERSION}"
          #define FW_TARGET        "${TARGET}"

          EOF

          echo "════════ version.h ════════"
          cat main/version.h

      # ────────────────────────────────────────────────
      # 编译
      # ────────────────────────────────────────────────
      - name: 编译固件
        shell: bash
        run: |
          set -o pipefail

          . "$IDF_PATH/export.sh"

          rm -rf build

          NPROC=$(nproc)

          echo "使用 $NPROC 核心编译"

          idf.py build -j "$NPROC" 2>&1 | tee build.log

      # ────────────────────────────────────────────────
      # 固件大小
      # ────────────────────────────────────────────────
      - name: 检查固件大小
        shell: bash
        run: |
          set -euo pipefail

          . "$IDF_PATH/export.sh"

          idf.py size

          APP_BIN="build/${PROJECT_NAME}.bin"

          if [[ ! -f "$APP_BIN" ]]; then
            echo "❌ 主固件不存在: $APP_BIN"
            echo "build目录中的bin文件:"
            ls -lah build/*.bin 2>/dev/null || true
            exit 1
          fi

          FW_SIZE=$(stat -c%s "$APP_BIN")

          echo "固件版本: ${FW_VERSION}"
          echo "固件路径: $APP_BIN"
          echo "固件大小: $((FW_SIZE / 1024)) KB"
          echo "固件大小: ${FW_SIZE} bytes"

      # ────────────────────────────────────────────────
      # 打包
      # ────────────────────────────────────────────────
      - name: 打包固件
        shell: bash
        run: |
          set -euo pipefail

          apt-get update
          apt-get install -y zip

          GIT_HASH=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date -u '+%Y%m%d_%H%M%S')

          PACKAGE_NAME="${PROJECT_NAME}_v${FW_VERSION}_${GIT_HASH}_${TIMESTAMP}"

          mkdir -p firmware_package

          APP_BIN="build/${PROJECT_NAME}.bin"

          if [[ ! -f "$APP_BIN" ]]; then
            echo "❌ 无法找到主固件: $APP_BIN"
            echo "build目录内容:"
            ls -lah build/ || true
            exit 1
          fi

          echo "📦 使用固件文件: $APP_BIN"
          echo "📦 固件版本: v${FW_VERSION}"

          # 主固件
          cp "$APP_BIN" \
            "firmware_package/${PROJECT_NAME}.bin"

          # Bootloader
          if [[ ! -f build/bootloader/bootloader.bin ]]; then
            echo "❌ 缺少 bootloader.bin"
            exit 1
          fi

          cp build/bootloader/bootloader.bin \
            firmware_package/

          # Partition Table
          if [[ ! -f build/partition-table.bin ]]; then
            echo "❌ 缺少 partition-table.bin"
            exit 1
          fi

          cp build/partition-table.bin \
            firmware_package/

          # 可选 storage.bin
          if [[ -f build/storage.bin ]]; then
            cp build/storage.bin \
              firmware_package/
          fi

          # SHA256
          (
            cd firmware_package
            sha256sum *.bin > SHA256SUMS.txt
          )

          # 烧录说明
          cat > firmware_package/FLASH_README.txt << EOF
          ESP32-C6 智能家庭终端固件烧录说明

          固件版本: v${FW_VERSION}
          Git Commit: ${GIT_HASH}
          ESP-IDF: ${IDF_VERSION}
          芯片: ESP32-C6

          使用 esptool：

          esptool.py \\
            --chip esp32c6 \\
            --port /dev/ttyUSB0 \\
            --baud 460800 \\
            write_flash \\
            0x0 bootloader.bin \\
            0x8000 partition-table.bin \\
            0x10000 ${PROJECT_NAME}.bin

          如果你的 USB 串口设备不是 /dev/ttyUSB0，
          请修改 --port 参数。
          EOF

          # TAR
          tar -czf "${PACKAGE_NAME}.tar.gz" firmware_package

          # ZIP
          zip -r "${PACKAGE_NAME}.zip" firmware_package

          echo "PACKAGE_NAME=${PACKAGE_NAME}" >> "$GITHUB_ENV"

          echo "════════ 固件包 ════════"
          ls -lh \
            "${PACKAGE_NAME}.tar.gz" \
            "${PACKAGE_NAME}.zip"

          echo "════════ firmware_package ════════"
          ls -lh firmware_package/

      # ────────────────────────────────────────────────
      # 上传固件 Artifact
      # ────────────────────────────────────────────────
      - name: 上传固件 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ env.PACKAGE_NAME }}
          path: |
            firmware_package/
            *.tar.gz
            *.zip
            build.log
          if-no-files-found: error
          retention-days: 30

      # ────────────────────────────────────────────────
      # 编译失败日志
      # ────────────────────────────────────────────────
      - name: 上传失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-build-log
          path: |
            build.log
            sdkconfig
          if-no-files-found: ignore
          retention-days: 14

      # ────────────────────────────────────────────────
      # 构建摘要
      # ────────────────────────────────────────────────
      - name: 生成构建摘要
        if: always()
        shell: bash
        run: |
          GIT_HASH=$(git rev-parse --short HEAD)

          APP_BIN="build/${PROJECT_NAME}.bin"

          FW_SIZE=0

          if [[ -f "$APP_BIN" ]]; then
            FW_SIZE=$(stat -c%s "$APP_BIN")
          fi

          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## 🏠 ESP32-C6 智能家庭终端

          | 项目 | 值 |
          |------|------|
          | 固件版本 | v${FW_VERSION:-unknown} |
          | Git Commit | \`${GIT_HASH}\` |
          | IDF 版本 | ${IDF_VERSION} |
          | 芯片 | ESP32-C6 |
          | 固件大小 | $((FW_SIZE / 1024)) KB |
          | 构建时间 | $(date -u '+%Y-%m-%d %H:%M UTC') |

          ### 硬件

          - ESP32-C6-DEV-KIT
          - INMP441 I2S 麦克风
          - MAX98357 I2S 功放
          - NEC 红外收发
          - MQTT
          - DeepSeek AI
          EOF

  # ═════════════════════════════════════════════════════
  # Job 3 - ESP-IDF v5.3 兼容性测试
  # ═════════════════════════════════════════════════════
  compat-test:
    name: 🧪 ESP-IDF v5.3 兼容性测试
    runs-on: ubuntu-22.04

    needs: lint

    if: |
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v')

    container:
      image: espressif/idf:release-v5.3
      options: --user root

    steps:

      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 修复 Git safe.directory
        run: |
          git config --global --add safe.directory '*'

      - name: 编译测试
        shell: bash
        run: |
          set -euo pipefail

          . "$IDF_PATH/export.sh"

          rm -f sdkconfig
          rm -rf build

          idf.py set-target esp32c6
          idf.py build

          echo "✅ ESP-IDF v5.3 编译通过"

  # ═════════════════════════════════════════════════════
  # Job 4 - GitHub Release
  # ═════════════════════════════════════════════════════
  release:
    name: 🚀 发布 Release
    runs-on: ubuntu-22.04

    needs:
      - build

    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:

      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载 Artifact
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true
          path: release_assets

      - name: 检查下载内容
        shell: bash
        run: |
          set -euo pipefail

          echo "📦 下载的 Release Assets:"
          ls -lah release_assets/

          echo ""
          echo "📂 firmware_package:"
          ls -lah release_assets/firmware_package/

      - name: 检查固件包
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "release_assets/firmware_package/${PROJECT_NAME}.bin"
            "release_assets/firmware_package/bootloader.bin"
            "release_assets/firmware_package/partition-table.bin"
            "release_assets/firmware_package/SHA256SUMS.txt"
            "release_assets/firmware_package/FLASH_README.txt"
          )

          for f in "${required_files[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "❌ 缺少: $f"
              exit 1
            fi

            echo "✅ $f"
          done

      - name: 生成 Release Notes
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Release Tag 格式错误: ${TAG}"
            echo "   正确格式: v0.1、v0.2、v1.0"
            exit 1
          fi

          SHA256_FILE="release_assets/firmware_package/SHA256SUMS.txt"

          cat > release_notes.md << EOF
          # 🏠 ESP32-C6 智能家庭终端 v${VERSION}

          ## 版本

          **v${VERSION}**

          ## 功能

          - INMP441 I2S 麦克风
          - MAX98357 音频播放
          - DeepSeek AI
          - MQTT 智能家居
          - Web 配置界面
          - 红外遥控

          ## 硬件接线

          | 模块 | ESP32-C6 引脚 |
          |------|--------------|
          | INMP441 SCK | GPIO16 |
          | INMP441 WS | GPIO17 |
          | INMP441 DATA | GPIO18 |
          | MAX98357 BCLK | GPIO6 |
          | MAX98357 LRC | GPIO7 |
          | MAX98357 DIN | GPIO15 |
          | 红外发射 | GPIO2 |
          | 红外接收 | GPIO3 |

          > ⚠️ 烧录前请确认 GPIO 与当前硬件版本一致。

          ## SHA256

          \`\`\`
          $(cat "$SHA256_FILE")
          \`\`\`

          ## 烧录

          使用 esptool：

          \`\`\`bash
          esptool.py \\
            --chip esp32c6 \\
            --port /dev/ttyUSB0 \\
            --baud 460800 \\
            write_flash \\
            0x0 bootloader.bin \\
            0x8000 partition-table.bin \\
            0x10000 ${PROJECT_NAME}.bin
          \`\`\`
          EOF

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ESP32-C6-v${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            release_assets/*.tar.gz
            release_assets/*.zip
            release_assets/firmware_package/*.bin
            release_assets/firmware_package/SHA256SUMS.txt
            release_assets/firmware_package/FLASH_README.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}