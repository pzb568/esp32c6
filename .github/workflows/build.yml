name: 🏠 ESP32-C6 智能家庭终端 自动编译

on:
  push:
    branches:
      - master
      - develop
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

  pull_request:
    branches:
      - master

  workflow_dispatch:
    inputs:
      idf_version:
        description: 'ESP-IDF Docker 标签'
        required: false
        default: 'release-v5.3'
        type: choice
        options:
          - release-v5.3

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IDF_VERSION: ${{ github.event.inputs.idf_version || 'release-v5.3' }}
  TARGET: esp32c6
  PROJECT_NAME: smart_home_terminal
  BASE_VERSION: '0.1'

jobs:

  # =====================================================
  # Job 1 - 代码检查
  # =====================================================
  lint:
    name: 🔍 代码检查
    runs-on: ubuntu-22.04

    steps:

      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: 检查 Git 状态
        shell: bash
        run: |
          set -euo pipefail
          echo "════════ Git 信息 ════════"
          echo "当前分支: $(git branch --show-current)"
          echo "当前提交: $(git rev-parse --short HEAD)"
          git status --short

      # -------------------------------------------------
      # 检查必要文件
      # -------------------------------------------------
      - name: 检查必要文件
        shell: bash
        run: |
          set -euo pipefail
          echo "════════ 项目结构检查 ════════"

          required_files=(
            "CMakeLists.txt"
            "main/CMakeLists.txt"
            "main/main.c"
            "sdkconfig.defaults"
            "partitions.csv"
          )

          missing=0
          for f in "${required_files[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "❌ 缺失: $f"
              missing=$((missing + 1))
            else
              echo "✅ 存在: $f"
            fi
          done

          if (( missing > 0 )); then
            echo "❌ 项目结构检查失败"
            exit 1
          fi

      # -------------------------------------------------
      # 检查自定义组件（与本地实际目录完全一致）
      #   components/ir_control
      #   components/audio
      #   components/mqtt_client
      #   components/ai_engine
      #   components/web_server
      # -------------------------------------------------
      - name: 检查自定义组件
        shell: bash
        run: |
          set -euo pipefail
          echo "════════ 自定义组件检查 ════════"

          required_components=(
            "components/ir_control/CMakeLists.txt"
            "components/audio/CMakeLists.txt"
            "components/mqtt_client/CMakeLists.txt"
            "components/ai_engine/CMakeLists.txt"
            "components/web_server/CMakeLists.txt"
          )

          missing=0
          for f in "${required_components[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "❌ 缺失: $f"
              missing=$((missing + 1))
            else
              echo "✅ 存在: $f"
            fi
          done

          if (( missing > 0 )); then
            echo "❌ 自定义组件检查失败"
            exit 1
          fi

      # -------------------------------------------------
      # 检查 main/CMakeLists.txt 中的组件依赖声明
      # -------------------------------------------------
      - name: 检查组件依赖声明
        shell: bash
        run: |
          set -euo pipefail
          echo "════════ 组件依赖检查 ════════"

          required_components=(
            "ir_control"
            "audio"
            "mqtt_client"
            "ai_engine"
            "web_server"
          )

          for component in "${required_components[@]}"; do
            if grep -qE "^\s+${component}\s*$" main/CMakeLists.txt; then
              echo "✅ main → ${component}"
            else
              echo "⚠️  main/CMakeLists.txt 未声明: ${component}"
            fi
          done

      # -------------------------------------------------
      # 验证 CMakeLists.txt 中 EXTRA_COMPONENT_DIRS 指向 components/
      # -------------------------------------------------
      - name: 检查 CMake 组件配置
        shell: bash
        run: |
          set -euo pipefail
          echo "════════ CMake 组件配置检查 ════════"

          if ! grep -q 'EXTRA_COMPONENT_DIRS' CMakeLists.txt; then
            echo "⚠️  CMakeLists.txt 未设置 EXTRA_COMPONENT_DIRS"
            echo "   建议添加: set(EXTRA_COMPONENT_DIRS "\${CMAKE_CURRENT_SOURCE_DIR}/components")"
          else
            echo "✅ CMakeLists.txt 已设置 EXTRA_COMPONENT_DIRS"
            grep 'EXTRA_COMPONENT_DIRS' CMakeLists.txt
          fi

          if ! grep -q 'components' CMakeLists.txt; then
            echo "❌ CMakeLists.txt 未将 components/ 加入组件路径"
            exit 1
          fi

          echo "✅ CMake 组件配置正确"

      # -------------------------------------------------
      # C/C++ 静态检查
      # -------------------------------------------------
      - name: 安装 cppcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cppcheck

      - name: C/C++ 静态检查
        shell: bash
        run: |
          set -o pipefail
          cppcheck \
            --enable=warning,style,performance \
            --inline-suppr \
            --suppress=missingInclude \
            --suppress=missingIncludeSystem \
            --error-exitcode=0 \
            -I main \
            -I components \
            main components \
            2>&1 | tee cppcheck_report.txt

      - name: 上传检查报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-report
          path: cppcheck_report.txt
          if-no-files-found: ignore
          retention-days: 7


  # =====================================================
  # Job 2 - 主构建
  # =====================================================
  build:
    name: 🔨 编译固件 (${{ github.event.inputs.idf_version || 'release-v5.3' }})
    runs-on: ubuntu-22.04
    needs: lint

    container:
      image: espressif/idf:${{ github.event.inputs.idf_version || 'release-v5.3' }}
      options: --user root

    steps:

      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 修复 Git safe.directory
        run: |
          git config --global --add safe.directory '*'

      - name: 缓存 IDF 工具链
        uses: actions/cache@v4
        with:
          path: /root/.espressif
          key: idf-tools-${{ env.IDF_VERSION }}-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            idf-tools-${{ env.IDF_VERSION }}-${{ runner.os }}-

      - name: 打印构建环境
        shell: bash
        run: |
          set -euo pipefail
          echo "════════════════════════════════════════"
          echo "ESP-IDF:  $IDF_VERSION"
          echo "TARGET:   $TARGET"
          echo "Runner:   ${{ runner.os }}"
          echo "Arch:     ${{ runner.arch }}"
          echo "Branch:   ${{ github.ref_name }}"
          echo "Commit:   ${{ github.sha }}"
          echo "════════════════════════════════════════"
          . "$IDF_PATH/export.sh"
          idf.py --version
          python --version
          git --version
          cmake --version

      # -------------------------------------------------
      # 配置目标芯片（检查实际组件目录）
      # -------------------------------------------------
      - name: 配置目标芯片
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"

          echo "════════ 工作区检查 ════════"
          pwd

          echo "════════ components 目录 ════════"
          ls -lah components/

          echo "════════ 组件目录验证 ════════"
          for comp in ir_control audio mqtt_client ai_engine web_server; do
            if [[ -d "components/${comp}" ]]; then
              echo "✅ components/${comp}"
            else
              echo "❌ components/${comp} 不存在"
              exit 1
            fi
          done

          echo "════════ 根 CMakeLists.txt ════════"
          cat CMakeLists.txt

          echo "════════ main/CMakeLists.txt ════════"
          cat main/CMakeLists.txt

          echo "════════ EXTRA_COMPONENT_DIRS 检查 ════════"
          if grep -q 'EXTRA_COMPONENT_DIRS' CMakeLists.txt; then
            echo "✅ CMakeLists.txt 已配置 EXTRA_COMPONENT_DIRS"
            grep 'EXTRA_COMPONENT_DIRS' CMakeLists.txt
          else
            echo "⚠️  CMakeLists.txt 未配置 EXTRA_COMPONENT_DIRS"
          fi

          echo "════════ 清理旧构建 ════════"
          rm -f sdkconfig
          rm -rf build

          echo "════════ 设置目标芯片 ════════"
          idf.py set-target "$TARGET"
          echo "✅ Target: $TARGET"

      # -------------------------------------------------
      # 确定固件版本
      # -------------------------------------------------
      - name: 确定固件版本
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
              echo "❌ Tag 格式错误: ${GITHUB_REF_NAME}"
              echo "   正确格式示例: v0.1、v0.2、v1.0"
              exit 1
            fi
          else
            VERSION="${BASE_VERSION}-dev"
          fi

          echo "FW_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "版本: v${VERSION}"

      # -------------------------------------------------
      # 生成版本头文件（printf 避免 heredoc 缩进问题）
      # -------------------------------------------------
      - name: 生成版本头文件
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TIME=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          GIT_HASH=$(git rev-parse --short HEAD)

          printf '#pragma once\n'                                     >  main/version.h
          printf '#define FW_VERSION     "%s"\n' "$FW_VERSION"        >> main/version.h
          printf '#define FW_GIT_HASH    "%s"\n' "$GIT_HASH"          >> main/version.h
          printf '#define FW_BUILD_TIME  "%s"\n' "$BUILD_TIME"        >> main/version.h
          printf '#define FW_IDF_VERSION "%s"\n' "$IDF_VERSION"       >> main/version.h
          printf '#define FW_TARGET      "%s"\n' "$TARGET"            >> main/version.h

          echo "════════ version.h ════════"
          cat main/version.h

      # -------------------------------------------------
      # 编译固件
      # -------------------------------------------------
      - name: 编译固件
        shell: bash
        run: |
          set -o pipefail
          . "$IDF_PATH/export.sh"
          NPROC=$(nproc)
          echo "使用 $NPROC 核心编译"
          idf.py build -- -j "$NPROC" 2>&1 | tee build.log

      # -------------------------------------------------
      # 检查固件大小
      # -------------------------------------------------
      - name: 检查固件大小
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"

          idf.py size

          APP_BIN="build/${PROJECT_NAME}.bin"
          if [[ ! -f "$APP_BIN" ]]; then
            echo "❌ 主固件不存在: $APP_BIN"
            ls -lah build/*.bin 2>/dev/null || true
            exit 1
          fi

          FW_SIZE=$(stat -c%s "$APP_BIN")
          echo "版本: v${FW_VERSION}"
          echo "大小: $((FW_SIZE / 1024)) KB ($FW_SIZE bytes)"

      # -------------------------------------------------
      # 打包固件
      # -------------------------------------------------
      - name: 打包固件
        shell: bash
        run: |
          set -euo pipefail

          apt-get update -qq
          apt-get install -y zip

          GIT_HASH=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date -u '+%Y%m%d_%H%M%S')
          PACKAGE_NAME="${PROJECT_NAME}_v${FW_VERSION}_${GIT_HASH}_${TIMESTAMP}"

          mkdir -p firmware_package

          APP_BIN="build/${PROJECT_NAME}.bin"
          [[ -f "$APP_BIN" ]] || { echo "❌ 找不到: $APP_BIN"; exit 1; }

          cp "$APP_BIN"                          firmware_package/
          cp build/bootloader/bootloader.bin      firmware_package/
          cp build/partition-table.bin            firmware_package/
          [[ -f build/storage.bin ]] && cp build/storage.bin firmware_package/ || true

          (cd firmware_package && sha256sum *.bin > SHA256SUMS.txt)

          {
            printf 'ESP32-C6 智能家庭终端固件烧录说明\n\n'
            printf '固件版本: v%s\n' "$FW_VERSION"
            printf 'Git Commit: %s\n' "$GIT_HASH"
            printf 'ESP-IDF: %s\n' "$IDF_VERSION"
            printf '芯片: ESP32-C6\n\n'
            printf '烧录命令:\n\n'
            printf 'esptool.py \\\n'
            printf '  --chip esp32c6 \\\n'
            printf '  --port /dev/ttyUSB0 \\\n'
            printf '  --baud 460800 \\\n'
            printf '  write_flash \\\n'
            printf '  0x0     bootloader.bin \\\n'
            printf '  0x8000  partition-table.bin \\\n'
            printf '  0x10000 %s.bin\n' "$PROJECT_NAME"
          } > firmware_package/FLASH_README.txt

          tar -czf "${PACKAGE_NAME}.tar.gz" firmware_package
          zip -qr  "${PACKAGE_NAME}.zip"    firmware_package

          echo "PACKAGE_NAME=${PACKAGE_NAME}" >> "$GITHUB_ENV"

          ls -lh "${PACKAGE_NAME}.tar.gz" "${PACKAGE_NAME}.zip"
          ls -lh firmware_package/

      # -------------------------------------------------
      # 上传固件 Artifact
      # -------------------------------------------------
      - name: 上传固件 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ env.PACKAGE_NAME }}
          path: |
            firmware_package/
            *.tar.gz
            *.zip
            build.log
          if-no-files-found: error
          retention-days: 30

      - name: 上传失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-build-log
          path: |
            build.log
            sdkconfig
          if-no-files-found: ignore
          retention-days: 14

      # -------------------------------------------------
      # 构建摘要
      # -------------------------------------------------
      - name: 生成构建摘要
        if: always()
        shell: bash
        run: |
          GIT_HASH=$(git rev-parse --short HEAD)
          APP_BIN="build/${PROJECT_NAME}.bin"
          FW_SIZE=0
          [[ -f "$APP_BIN" ]] && FW_SIZE=$(stat -c%s "$APP_BIN")

          {
            echo "## 🏠 ESP32-C6 智能家庭终端"
            echo ""
            echo "| 项目 | 值 |"
            echo "|------|------|"
            echo "| 固件版本 | v${FW_VERSION:-unknown} |"
            echo "| Git Commit | \`${GIT_HASH}\` |"
            echo "| IDF 版本 | ${IDF_VERSION} |"
            echo "| 芯片 | ESP32-C6 |"
            echo "| 固件大小 | $((FW_SIZE / 1024)) KB |"
            echo "| 构建时间 | $(date -u '+%Y-%m-%d %H:%M UTC') |"
            echo ""
            echo "### 组件"
            echo "- ir_control / audio / mqtt_client / ai_engine / web_server"
          } >> "$GITHUB_STEP_SUMMARY"


  # =====================================================
  # Job 3 - ESP-IDF v5.3 兼容性测试
  # =====================================================
  compat-test:
    name: 🧪 ESP-IDF v5.3 兼容性测试
    runs-on: ubuntu-22.04
    needs: lint

    if: |
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/master'   ||
      startsWith(github.ref, 'refs/tags/v')

    container:
      image: espressif/idf:release-v5.3
      options: --user root

    steps:

      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 修复 Git safe.directory
        run: |
          git config --global --add safe.directory '*'

      - name: 编译测试
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"

          echo "════════ ESP-IDF v5.3 兼容性测试 ════════"
          git rev-parse HEAD
          ls -lah components/

          echo "════════ 组件目录验证 ════════"
          for comp in ir_control audio mqtt_client ai_engine web_server; do
            if [[ ! -d "components/${comp}" ]]; then
              echo "❌ components/${comp} 不存在"
              exit 1
            fi
            echo "✅ components/${comp}"
          done

          if grep -q 'EXTRA_COMPONENT_DIRS' CMakeLists.txt; then
            echo "✅ CMakeLists.txt 已配置 EXTRA_COMPONENT_DIRS"
          else
            echo "⚠️  CMakeLists.txt 未配置 EXTRA_COMPONENT_DIRS"
          fi

          rm -f sdkconfig
          rm -rf build

          idf.py set-target esp32c6
          idf.py build

          echo "✅ ESP-IDF v5.3 编译通过"


  # =====================================================
  # Job 4 - GitHub Release
  # =====================================================
  release:
    name: 🚀 发布 Release
    runs-on: ubuntu-22.04
    needs:
      - build

    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:

      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载 Artifact
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true
          path: release_assets

      - name: 检查下载内容
        shell: bash
        run: |
          set -euo pipefail
          echo "📦 Release Assets:"
          ls -lah release_assets/
          echo ""
          echo "📂 firmware_package:"
          ls -lah release_assets/firmware_package/

      - name: 检查固件包
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "release_assets/firmware_package/${PROJECT_NAME}.bin"
            "release_assets/firmware_package/bootloader.bin"
            "release_assets/firmware_package/partition-table.bin"
            "release_assets/firmware_package/SHA256SUMS.txt"
            "release_assets/firmware_package/FLASH_README.txt"
          )

          for f in "${required_files[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "❌ 缺少: $f"
              exit 1
            fi
            echo "✅ $f"
          done

      - name: 生成 Release Notes
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Release Tag 格式错误: ${TAG}"
            echo "   正确格式: v0.1、v0.2、v1.0"
            exit 1
          fi

          SHA256_CONTENT=$(cat "release_assets/firmware_package/SHA256SUMS.txt")

          {
            printf '# 🏠 ESP32-C6 智能家庭终端 v%s\n\n' "$VERSION"
            printf '## 功能\n\n'
            printf '- INMP441 I2S 麦克风 + VAD 语音检测\n'
            printf '- MAX98357 I2S 功放 + TTS 语音提示\n'
            printf '- NEC 红外控制：空调/电视/机顶盒/风扇/灯光\n'
            printf '- HTTP 网络电台流媒体播放\n'
            printf '- MQTT 智能家居联动\n'
            printf '- Web 配置控制台\n\n'
            printf '## 硬件接线\n\n'
            printf '| 模块 | ESP32-C6 引脚 |\n'
            printf '|------|---------------|\n'
            printf '| INMP441 SCK  | GPIO 16 |\n'
            printf '| INMP441 WS   | GPIO 17 |\n'
            printf '| INMP441 DATA | GPIO 18 |\n'
            printf '| MAX98357 BCLK| GPIO 6  |\n'
            printf '| MAX98357 LRC | GPIO 7  |\n'
            printf '| MAX98357 DIN | GPIO 15 |\n'
            printf '| 红外发射     | GPIO 2  |\n'
            printf '| 红外接收     | GPIO 3  |\n\n'
            printf '> ⚠️ 烧录前请确认 GPIO 与当前硬件版本一致。\n\n'
            printf '## SHA256\n\n```\n%s\n```\n\n' "$SHA256_CONTENT"
            printf '## 烧录\n\n```bash\n'
            printf 'esptool.py \\\n'
            printf '  --chip esp32c6 \\\n'
            printf '  --port /dev/ttyUSB0 \\\n'
            printf '  --baud 460800 \\\n'
            printf '  write_flash \\\n'
            printf '  0x0     bootloader.bin \\\n'
            printf '  0x8000  partition-table.bin \\\n'
            printf '  0x10000 %s.bin\n' "$PROJECT_NAME"
            printf '```\n'
          } > release_notes.md

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ESP32-C6-${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            release_assets/*.tar.gz
            release_assets/*.zip
            release_assets/firmware_package/*.bin
            release_assets/firmware_package/SHA256SUMS.txt
            release_assets/firmware_package/FLASH_README.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
